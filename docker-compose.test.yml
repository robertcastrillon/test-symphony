version: "3.9"

services:
  db_test:
    image: postgres:16
    environment:
      POSTGRES_USER: chronotrack
      POSTGRES_PASSWORD: chronotrack
      POSTGRES_DB: chronotrack_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronotrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  api_test:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://chronotrack:chronotrack@db_test:5432/chronotrack_test
      SECRET_KEY: test-secret-key-for-ci
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      APP_ENV: test
      DEBUG: false
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      db_test:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             pytest apps/api/tests --cov=apps/api/app --cov-report=term-missing --cov-fail-under=80"
