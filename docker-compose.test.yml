services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chronotrack_test
      POSTGRES_PASSWORD: chronotrack_test
      POSTGRES_DB: chronotrack_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronotrack_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-test:
    build:
      context: ./apps/api
    command: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=75 -q
    environment:
      CHRONOTRACK_DATABASE_URL: sqlite+aiosqlite:///./test.db
      CHRONOTRACK_JWT_SECRET_KEY: test-secret-key
      CHRONOTRACK_JWT_REFRESH_SECRET_KEY: test-refresh-secret-key
    depends_on:
      db-test:
        condition: service_healthy
