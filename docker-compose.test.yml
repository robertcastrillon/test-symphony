version: "3.9"

services:
  db_test:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: chronotrack_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 3s
      retries: 10

  api_test:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://test:test@db_test:5432/chronotrack_test
      JWT_SECRET_KEY: test-secret-key-for-ci
      JWT_REFRESH_SECRET_KEY: test-refresh-secret-key-for-ci
    depends_on:
      db_test:
        condition: service_healthy
    command: >
      sh -c "
        alembic upgrade head &&
        python -m pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=80
      "
    volumes:
      - ./apps/api:/app
