name: CI

on:
  pull_request:
    branches: [develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: cd apps/api && pip install -e ".[dev]"
      - name: Ruff lint
        run: cd apps/api && ruff check .
      - name: Ruff format check
        run: cd apps/api && ruff format --check .
      - name: Bandit security scan
        run: cd apps/api && bandit -r app -ll --exclude app/tests -q || true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: cd apps/api && pip install -e ".[dev]"
      - name: Run tests with coverage
        run: cd apps/api && pytest --cov=app --cov-report=term-missing --cov-fail-under=75 -q
