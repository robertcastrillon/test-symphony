name: CI

on:
  pull_request:
    branches: [develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ruff bandit
      - name: Lint
        run: cd apps/api && ruff check . && ruff format --check .
      - name: Security scan
        run: cd apps/api && bandit -r app -ll -q

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd apps/api
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          cd apps/api
          python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=75 -q
