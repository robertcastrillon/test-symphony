[project]
name = "chronotrack-bot"
version = "0.1.0"
description = "ChronoTrack Telegram Bot"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=20.0,<21.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM"]
ignore = ["S101", "S105", "S106", "N818"]

[tool.ruff.lint.isort]
known-first-party = ["bot"]

[tool.setuptools.packages.find]
include = ["bot*"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
