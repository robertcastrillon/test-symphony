version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: chronotrack
      POSTGRES_USER: chronotrack
      POSTGRES_PASSWORD: chronotrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronotrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://chronotrack:chronotrack@db:5432/chronotrack
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-supersecretkey}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:-supersecretrefreshkey}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 30
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app

  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./apps/web:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    profiles:
      - web

  bot:
    build:
      context: ./apps/bot
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    profiles:
      - bot

volumes:
  postgres_data:
